<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="stylelogin.css">
</head>

<body>
    <div class="container-fluid">
        <div class="login h-100">
            <form action="home.html" method="get">
                <h1>Login</h1>
                <div class="log"><input type="text" id="usname" placeholder="  Enter Username"
                        style="width: 190px; height: 35px;" required><i class="fa-solid fa-user logo"></i></div>

                <div class="log"><input type="password" id="passwd" placeholder="  Enter Password"
                        style="width: 190px; height: 35px;" required><i class="fa-solid fa-lock logo"></i></div>

                <div class="link">
                    <a href="">Forgot password?</a>
                </div>
                <br>
                <button>Login</button>


                <p>Not a user? <a href="reg.html">Sign Up</a></p>
            </form>
        </div>
    </div>
</body>

</html>
